repos:
  # Fix end of files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: .*\.qgs
      - id: end-of-file-fixer
        exclude: .*\.qgs
      - id: mixed-line-ending
        exclude: .*\.qgs
        args:
          - '--fix=lf'

  # Remove unused imports/variables
  - repo: https://github.com/PyCQA/autoflake
    rev: v2.3.3
    hooks:
      - id: autoflake
        args:
          - "--in-place"
          - "--remove-all-unused-imports"
          - "--remove-unused-variables"

  # Sort imports
  - repo: https://github.com/pycqa/isort
    rev: "9.0.0a3"
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Black formatting
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: "26.5.1"
    hooks:
      - id: black
        args: ["--line-length=99"]

  # tool to automatically upgrade syntax for newer versions of the language
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py310-plus]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
        # Critical mandatory checks from QGIS plugin repository that prevent publishing a new version of the plugin
        # NOTE: Ruff uses `S` and Bandit `B` prefixes, so both codes must be excluded per line.
        # Keep in sync with https://github.com/qgis/QGIS-Plugins-Website/blob/master/qgis-app/plugins/management/commands/data/bandit_rules.json
      - id: bandit
        args: [
          "-t", "B102,B103,B105,B106,B107,B201,B202,B301,B302,B304,B305,B306,B307,B312,B321,B323,B401,B402,B412,B413,B501,B502,B503,B505,B506,B507,B601,B602,B604,B605,B609,B610,B611,B612,B613,B701",
          "-x", "./.venv,./venv,./.cache,./build,./dist",
          "-r", ".",
        ]

  # Lint files
  - repo: https://github.com/pycqa/flake8
    rev: "7.3.0"
    hooks:
      - id: flake8
        args: [
          "--max-line-length=115",
          # ignore long comments (E501), as long lines are formatted by black
          "--ignore=E501,E203,W503",
        ]

ci:
  autofix_prs: true
  autoupdate_schedule: quarterly
